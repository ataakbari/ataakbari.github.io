<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quantum Computing Blog by Ata Akbari Asanjan">
    <title>Blog Post - Ata Akbari Asanjan</title>
    <link rel="stylesheet" href="styles/github-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- MathJax for math rendering -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">Ata Akbari Asanjan</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Overview</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="quantum-blog.html" class="active">Quantum Blog</a></li>
            </ul>
        </div>
    </nav>

    <!-- Blog Post Content -->
    <article class="content-section">
        <div class="container" style="max-width: 900px;">
            <div class="mb-3">
                <a href="quantum-blog.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Blog
                </a>
            </div>
            
            <!-- Markdown content will be loaded here -->
            <div id="markdown-content" data-md-file=""></div>
        </div>
    </article>

    <!-- Related Posts -->
    <section class="content-section" style="background-color: var(--color-canvas-subtle);">
        <div class="container" style="max-width: 900px;">
            <h3 class="mb-3">Related Posts</h3>
            <div id="related-posts"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Ata Akbari Asanjan. All rights reserved.</p>
        </div>
    </footer>

    <script src="scripts/markdown-renderer.js"></script>
    <script>
        // Get markdown file from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const postFile = urlParams.get('post');
        
        if (postFile) {
            document.getElementById('markdown-content').dataset.mdFile = `posts/${postFile}.md`;
        } else {
            document.getElementById('markdown-content').innerHTML = '<p>No blog post specified.</p>';
        }
    </script>
</body>
</html>
